name: Deploy Documentation to Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/check-docs.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: site/Gemfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate documentation structure
        run: |
          npm ci
          npm run docs:check

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          bundler: "2.6.9"

      - name: Build Jekyll site
        run: |
          BUNDLE_GEMFILE=site/Gemfile bundle exec jekyll build \
            --source site \
            --destination site/_site \
            --baseurl "/PhonyC"
          touch site/_site/.nojekyll

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site/_site
          publish_branch: gh-pages
          force_orphan: true
